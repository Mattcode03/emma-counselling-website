name: CI

# The site is hosted on Cloudflare Pages, which builds and deploys it straight
# from this repository. This workflow no longer deploys anything: it
# type-checks and builds every push and pull request so a broken change is
# caught here before Cloudflare publishes it.

on:
  push:
    branches: [main]
  pull_request:
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Read-only token: this workflow never writes to the repo or deploys.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build
